services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_BASE_PATH: "${APP_BASE_PATH:-/}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      APP_BASE_PATH: "${APP_BASE_PATH:-/}"
      DATABASE_PATH: /app/data/modulpro.sqlite
    expose:
      - "3000"
    volumes:
      - app_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  app_data:
